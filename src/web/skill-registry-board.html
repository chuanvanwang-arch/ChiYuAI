<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方法论 SKILL 注册表</title>
  <link rel="stylesheet" href="/portal/tokens.css" />
  <link rel="stylesheet" href="/portal/common.css" />
  <link rel="stylesheet" href="/portal/page.css" />
  <script type="module">
    import { injectLayout } from '/portal/layout.js';
    injectLayout();
  </script>
  <script type="module" src="/portal/components.js"></script>
</head>
<body>
  <div id="skill-registry-root">
    <div class="pg-loading">SKILL 注册表加载中…</div>
  </div>
  <script type="module">
    import { get } from '/portal/api.js';
    const root = document.getElementById('skill-registry-root');
    async function load() {
      try {
        const { html } = await get('/api/page/skill-registry');
        root.innerHTML = html;
      } catch (e) {
        root.innerHTML = `<div class="pg-error">SKILL 注册表加载失败：${e.message}（PG 未启动或端点未就绪）</div>`;
      }
    }
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
