<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>页面市场 · CRM 受控面</title>
  <link rel="stylesheet" href="/portal/tokens.css">
  <link rel="stylesheet" href="/portal/common.css">
  <link rel="stylesheet" href="/portal/page.css">
<style>
 /* 2026-08-30：删除本页 :root 重定义并补齐缺失的 tokens.css / common.css。
    原 :root 存在四类问题：① panel/mut/ac 三个变量均引用自身，按 CSS 规范属 invalid
    at computed-value time，连带 body 的 background 与 color 失效；② ink 硬编码为
    深色（与背景同色，文字不可读）；③ line 为浅色，深色主题下突兀；④ as 的值
    var(--panel)2ff 属语法错误，整条声明无效。叠加本页原先只链 page.css、
    从未引入 tokens.css，导致 bg/panel/ink 等全部无定义。现统一由 tokens.css 提供。 */
 *{box-sizing:border-box}body{margin:0;font-family:system-ui,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
 .app{display:block;min-height:100vh}
 .side{background:#0f172a;color:var(--mut);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
 .side .brand{color:#fff;font-weight:700;margin:4px 8px 14px}
 .nav a{color:var(--mut);text-decoration:none;padding:9px 12px;border-radius:9px;font-size:13px;display:block}
 .nav a.active,.nav a:hover{background:#1e293b;color:#fff}
 .side .foot{margin-top:auto;font-size:11px;color:var(--mut)}
 .main{padding:22px 26px}
 .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
 .head h1{font-size:18px;margin:0}.head .sub{font-size:12px;color:var(--mut)}
 .bar{display:flex;gap:10px;margin:14px 0}
 .bar input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}


 .empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0;font-size:13px}
 .pv{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50}
 .pv.show{display:flex}
 .pv .box{background:var(--panel);border-radius:16px;width:min(920px,92vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(15,23,42,.3)}
 .pv .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
 .pv .bar b{font-size:14px}
 .pv .bar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
 .pv .bar button:hover{border-color:var(--ac);color:var(--ac)}
 .pv iframe{flex:1;width:100%;border:none;background:var(--panel)}
</style>
<link rel="stylesheet" href="/portal/tokens.css" />
<link rel="stylesheet" href="/portal/common.css" />
  <script type="module" src="/portal/components.js"></script>
</head>
<body>
<div class="app">
  <main class="main">
    <header class="page-head">
      <div class="ph-main"><h1 class="page-title">页面市场</h1></div>
      <div class="page-actions"><span class="ph-count" id="count">—</span></div>
    </header>
    <div class="bar"><crm-input id="q" placeholder="筛选（id / 标题，如 S20、七维）"></crm-input></div>
    <div class="grid" id="grid"><div class="empty">加载中…</div></div>
  </main>
</div>
<div class="pv" id="pv"><div class="box">
  <div class="bar"><b id="pvTitle">—</b><crm-button onclick="closePv()">✕ 关闭</crm-button></div>
  <iframe id="pvFrame" srcdoc=""></iframe>
</div></div>
<div id="forbidden" style="display:none;text-align:center;padding:60px 20px">
  <h2>需要 admin 权限</h2>
  <p>页面市场为管理员独享，请用管理员账号 <a href="/home.html">重新登录</a>。</p>
</div>
<script type="module">
import { get } from '/portal/api.js';
const grid = document.getElementById('grid'), count = document.getElementById('count');
const TYPE_LABELS = { form: '表单页', table: '表格页', detail: '详情页', dashboard: '看板页', list: '列表页', workbench: '工作台' };
let PAGES = [];
async function load() {
  try {
    const j = await get('/api/page-market');
    PAGES = j.pages || [];
    count.textContent = `${j.total || PAGES.length} 面`;
  } catch (e) {
    grid.innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
    return;
  }
  render();
}
function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const items = q ? PAGES.filter(p => (p.id || '').toLowerCase().includes(q) || (p.title || '').toLowerCase().includes(q)) : PAGES;
  grid.innerHTML = items.length ? items.map(p => `
    <div class="card" onclick="openPv('${p.id}')">
      <span class="id">${p.id}</span>
      <h3>${p.title || p.id}</h3>
      <div class="type">类型：${TYPE_LABELS[p.type] || p.type || '—'}</div>
      <div class="nav">路由：${(p.navigation && p.navigation.to) || '（无独立路由）'}</div>
    </div>`).join('') : '<div class="empty">无匹配页面</div>';
}
async function openPv(id) {
  try {
    const j = await get(`/api/page-market/${id}`);
    document.getElementById('pvTitle').textContent = `${j.id} · ${(j.schema && j.schema.title) || ''}`;
    document.getElementById('pvFrame').srcdoc =
      `<style>body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}.pg-page{display:block;padding:18px}h2{font-size:15px;margin:0 0 10px;color:var(--ink)}.pg-unknown{color:var(--mut)}</style>` +
      (j.html || '<div style="padding:24px;color:var(--mut)">（渲染空）</div>');
    document.getElementById('pv').classList.add('show');
  } catch (e) { alert('预览失败: ' + e.message); }
}
function closePv() { document.getElementById('pv').classList.remove('show'); }
document.getElementById('q').addEventListener('input', render);
// 暴露给第二段 module 守卫（前端 admin 守卫外层单独判断是否调用 load/openPv）
window.__pageMarket = { load, openPv };
// load() 改由下方前端 admin 守卫按需调用，不再此处无条件执行
</script>
  <script type="module">
import { me } from '/portal/api.js';
    import { injectLayout } from '/portal/layout.js';
    injectLayout();
    // 前端 admin 守卫：与 config.html 同约定（token 存 localStorage，整页 <a> 跳转不带 Authorization 头，故服务端不放 requireAdmin）
    const who = await me().catch(() => null);
    if (!who || who.role !== 'admin') {
      const app = document.querySelector('.app');
      if (app) app.style.display = 'none';
      const fb = document.getElementById('forbidden');
      if (fb) fb.style.display = 'block';
    } else {
      window.__pageMarket.load();
      const origOpen = window.openPv;
      window.openPv = (id) => window.__pageMarket.openPv(id);
    }
  </script>
</body>
</html>
