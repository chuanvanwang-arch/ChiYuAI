<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信号投递配置</title>
  <link rel="stylesheet" href="/portal/tokens.css" />
  <link rel="stylesheet" href="/portal/common.css" />
  <script type="module" src="/portal/components.js"></script>
  <style>
    body { font-family: -apple-system, "Microsoft YaHei", sans-serif; margin: 24px; background: var(--bg); color: var(--ink); }
    .note { background: var(--warn); border: 1px solid var(--warn); padding: 8px 12px; border-radius: 6px; font-size: 13px; margin: 8px 0 16px; }
    .tabs { display: flex; gap: 8px; margin: 12px 0; }
    .tabs button { padding: 6px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
    .tabs button.on { background: var(--ac); color: #fff; border-color: var(--ac); }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--panel); }
    .card h3 { margin: 0 0 6px; font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 13px; margin: 6px 0; }
    label { display: flex; gap: 6px; align-items: center; color: var(--ink); }
    .kv { display: inline-block; width: 60px; color: var(--mut); }
    .hint { color: var(--mut); font-size: 12px; margin: 4px 0; }
    input[type=number], input[type=text] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; }
    input[type=number] { width: 84px; }
    input.rr { width: 300px; }
    .toolbar { margin: 14px 0; }
    button.save { padding: 6px 14px; border: none; border-radius: 6px; background: var(--ac); color: #fff; cursor: pointer; }
    .summary { color: var(--mut); font-size: 13px; margin-left: 10px; }
    .err { color: var(--err); font-size: 13px; margin-left: 10px; }
    .st { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; font-size: 13px; padding: 4px 0; border-top: 1px dashed var(--line); }
    .st .nm { font-weight: 600; min-width: 68px; }
    .st .dt { color: var(--mut); font-size: 12px; }
    .b { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); }
    .b.ok { color: var(--ok, #15803d); border-color: var(--ok, #15803d); }
    .b.warn { color: var(--warn-ink, #a16207); border-color: var(--warn-ink, #a16207); }
    .b.no { color: var(--err); border-color: var(--err); }
    .b.off { color: var(--mut); }
  </style>
</head>
<body>
  <header class="page-head"><div class="ph-main"><h1 class="page-title">信号投递配置</h1></div></header>
  <div class="note">⚠️ 本页读写 <code>config_store</code> 两个键：<b>signal-delivery</b>（渠道开关 / 逐级路由 / 收件人 / 静默时段 / 频次上限 / 重试）与
    <b>signal-dispatch</b>（投递泵候选集时间窗）。写经决策第 0 闸（无决策不写）+ sysadmin 闸。
    <br>⛔ <b>渠道「已开启」≠「会送达」</b>：外发渠道（email / im / webhook）还需①凭据就绪 ②渠道已实现。下方状态条为<b>实时探测结果</b>，
    不一致时以状态条为准（例如 <code>im</code> 渠道当前<b>未实现</b>，开启后仍会落 <code>skipped</code>，不会写假 <code>sent</code>）。</div>

  <div id="status"></div>

  <div class="tabs">
    <button data-tab="delivery" class="on">投递渠道与策略（signal-delivery）</button>
    <button data-tab="dispatch">投递泵窗口（signal-dispatch）</button>
  </div>
  <div id="app">加载中…</div>
  <div class="toolbar">
    <button class="save" id="save">保存当前页</button>
    <span class="summary" id="summary"></span>
    <span class="err" id="err"></span>
  </div>

  <script type="module">
    import { injectLayout } from '/portal/layout.js';
    import { get, put } from '/portal/api.js';
    injectLayout();

    // 两个配置键的唯一映射（改键名只改这里）
    const KEYS = { delivery: 'signal-delivery', dispatch: 'signal-dispatch' };
    // 渠道集合与严重度取值：与 src/signal/route.js 的 ALL_CHANNELS 同步（该文件是消费端契约）
    const CHANNELS = ['inbox', 'email', 'im', 'webhook'];
    const SEVERITIES = ['high', 'medium', 'low'];
    const ROLES = ['sales', 'manager', 'finance', 'platform'];

    const app = document.getElementById('app');
    let tab = 'delivery';
    let current = null;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ── 渠道就绪性：实时探测（凭据）× 代码事实（是否已实现），两者必须分开显示 ──
    // 渠道状态判定（2026-09-17 修正：**事实优先于配置预测**）
    //   原实现只用「已开启 ∧ 凭据就绪 ∧ 已实现」→ 显示「可送达」。但 credentials_ok 的语义是
    //   「凭据**已配置**（非空）」，**不是**「凭据有效」：email 的 verifyConfig 是存在性检查。
    //   实证：.env 的 SMTP_PASS 为占位符 __REPLACE_WI… 时，本页曾显示「可送达」，
    //   而真实投递 4/4 全部 failed（Invalid login: 550 User has no permission）。
    //   ⇒ 判决以台账 verdict 为准（last_sent / last_failed / last_skipped / never_attempted），
    //     「配置预测」只作为兜底文案，且措辞不得暗示已验证。
    function channelState(c) {
      const lastTxt = c.last
        ? `上次：${c.last.status}${c.last.last_error ? ' · ' + c.last.last_error : ''}`
        : '';
      // 判决优先级（2026-09-17 二次修正）：**事实优先，冲突并列**。
      //   ① 事实与配置层预测**冲突**时两者都要说 —— 这是最有价值的一格：email 的情形正是
      //      credential_ok=true / deliverable=true 而台账 last=failed。若按「配置优先」呈现，
      //      就会显示"就绪"，把唯一能证伪的证据盖掉（真实投递 4/4 全失败却显示正常）。
      //   ② 无冲突时以事实为准；③ 从未投递过（never_attempted）才退回配置层预测，措辞不得暗示已验证。
      const factSent = c.verdict === 'last_sent';
      const factFailed = c.verdict === 'last_failed';
      const confOk = c.enabled && c.credentials_ok && c.implemented;
      if (factFailed && confOk) {
        return ['no', `上次投递失败：${c.last.last_error || '未知'}（凭据/实现看起来就绪，但真实投递未通过）`, lastTxt];
      }
      if (factSent && !confOk) {
        return ['warn', '上次已送达；但当前配置已不再满足外发条件 → 后续会失败', lastTxt];
      }
      if (factFailed) {
        return ['no', `上次投递失败：${c.last.last_error || '未知原因'}`, lastTxt];
      }
      if (!c.implemented) {
        return c.enabled
          ? ['no', '已开启但渠道未实现（会落 failed/skipped，绝不写假 sent）', lastTxt]
          : ['no', '渠道未实现', lastTxt];
      }
      if (!c.enabled) return ['off', '未启用', lastTxt];
      if (!c.credentials_ok) return ['warn', '已开启但凭据未配置 → 会落 failed', lastTxt];
      if (factSent) return ['ok', '上次已送达（台账实证）', lastTxt];
      if (c.verdict === 'last_skipped') return ['warn', '上次被跳过（配额/静默时段/无收件人/重试耗尽）', lastTxt];
      // never_attempted：配置齐但**从未真实投递过** → 只能给"待验证"，不得说"可送达"
      return ['warn', '凭据已配置 · 从未真实投递过（有效性待验证）', lastTxt];
    }

    async function loadStatus() {
      const box = document.getElementById('status');
      try {
        const d = await get('/api/signals/delivery-status');
        const rows = Object.entries(d.channels || {}).map(([name, c]) => {
          const [cls, text, lastTxt] = channelState(c);
          const cred = c.needs_credentials
            ? `<span class="dt">凭据：${c.credentials_ok ? '已配置（有效性待真实投递验证）' : esc(c.credentials_error || '未配置')}${(c.env || []).length ? `（env: ${c.env.join(' / ')}）` : ''}</span>`
            : '';
          const ev = lastTxt ? `<span class="dt">${esc(lastTxt)}</span>` : '';
          return `<div class="st"><span class="nm">${esc(name)}</span><span class="b ${cls}">${esc(text)}</span>${cred}${ev}<span class="dt">${esc(c.note || '')}</span></div>`;
        }).join('');
        box.innerHTML = `<section class="card"><h3>渠道就绪性（实时探测 + 真实台账回显 · 零写）</h3>
          <p class="hint"><b>判决以投递台账为准</b>（sent 行代表真实往返）。「凭据已配置」只代表非空，
            有效性只能由真实投递证明 —— 占位符凭据会让配置看起来就绪、实际每次都 failed。</p>${rows}</section>`;
      } catch (e) {
        box.innerHTML = `<section class="card"><p class="err">渠道状态读取失败：${esc(e.message)}</p></section>`;
      }
    }

    // ── TAB1：signal-delivery ──
    function deliveryHtml(cfg) {
      const ch = cfg.channels || {};
      const rt = cfg.route || {};
      const rr = cfg.role_recipients || {};
      const qh = cfg.quiet_hours || null;
      const rl = cfg.rate_limit || null;
      return `
      <section class="card">
        <h3>渠道开关</h3>
        <p class="hint">渠道集合是投递路由的<b>唯一事实源</b>（零硬编码默认值）。出厂仅 <b>inbox</b> 开启；外发渠道需凭据与收件人同时就绪，
          否则落 failed / skipped 留痕（不静默、不伪造 sent）。</p>
        <div class="row">${CHANNELS.map((c) => `<label><input type="checkbox" class="ch-on" data-ch="${c}" ${ch[c] === 'on' || ch[c] === true ? 'checked' : ''}/> ${esc(c)}</label>`).join('')}</div>
      </section>
      <section class="card">
        <h3>逐级路由（严重度 → 渠道）</h3>
        <p class="hint">留空 = 该级别回落到「全部已启用渠道」。所选渠道会被 ∩ 已启用集合（配置冲突不越权外发）。</p>
        ${SEVERITIES.map((s) => `<div class="row"><span class="kv">${esc(s)}</span>${CHANNELS.map((c) => `<label><input type="checkbox" class="rt" data-sev="${s}" data-ch="${c}" ${(rt[s] || []).includes(c) ? 'checked' : ''}/> ${esc(c)}</label>`).join('')}</div>`).join('')}
      </section>
      <section class="card">
        <h3>收件人（角色 → 收件人）</h3>
        <p class="hint">解析不到收件人 → 显式 <code>recipientMiss</code> skip 留痕（不静默）。<b>platform</b> 仅供 system 租户回退，非 system 租户绝不回退（跨租户隔离）。</p>
        ${ROLES.map((r) => `<div class="row"><span class="kv">${esc(r)}</span><input type="text" class="rr" data-role="${r}" value="${esc((rr[r] || []).join(', '))}" placeholder="邮箱，多个用逗号分隔"/></div>`).join('')}
      </section>
      <section class="card">
        <h3>静默时段 / 频次上限 / 重试</h3>
        <div class="row">
          <label><input type="checkbox" id="qh-on" ${qh ? 'checked' : ''}/> 启用静默时段</label>
          <label>起 <input type="number" id="qh-start" min="0" max="23" value="${qh?.start ?? 22}"/></label>
          <label>止 <input type="number" id="qh-end" min="0" max="23" value="${qh?.end ?? 7}"/></label>
          <span class="hint">支持跨午夜（如 22 → 7）</span>
        </div>
        <div class="row">
          <label>每日上限 <input type="number" id="rl-day" min="0" value="${rl?.per_day ?? ''}"/></label>
          <label>每小时上限 <input type="number" id="rl-hour" min="0" value="${rl?.per_hour ?? ''}"/></label>
          <label>重试次数 <input type="number" id="retry" min="0" value="${cfg.retry ?? 0}"/></label>
          <span class="hint">频次上限留空 = 不限制；重试 0 = 不可自愈</span>
        </div>
      </section>`;
    }

    // ── TAB2：signal-dispatch ──
    function dispatchHtml(cfg) {
      return `
      <section class="card">
        <h3>投递泵候选集时间窗</h3>
        <p class="hint">投递泵每轮只取该窗口内的信号（<code>src/signal/dispatcher.js</code> 消费）。
          窗口过大 → 补投陈旧信号（可能对已完成事项重复提醒）；过小 → 漏投。</p>
        <div class="row"><label>max_age_days <input type="number" id="mad" min="1" value="${cfg.max_age_days ?? 7}"/></label></div>
      </section>`;
    }

    async function load() {
      app.textContent = '加载中…';
      document.getElementById('err').textContent = '';
      try {
        const d = await get(`/api/config/${KEYS[tab]}`);
        current = d.value || {};
        app.innerHTML = tab === 'delivery' ? deliveryHtml(current) : dispatchHtml(current);
        document.getElementById('summary').textContent = `键 ${KEYS[tab]}`;
      } catch (e) {
        current = null;
        app.innerHTML = `<p class="err">读取失败：${esc(e.message)}（配置键可能尚未播种）</p>`;
      }
    }

    // 以服务端原值为底本，仅覆盖本页可编辑字段（不丢未展示字段）
    function collect() {
      if (tab === 'dispatch') {
        const base = { ...(current || {}) };
        const v = document.getElementById('mad')?.value;
        if (v !== '' && v != null) base.max_age_days = Number(v);
        return base;
      }
      const base = { ...(current || {}) };
      const ch = {};
      document.querySelectorAll('.ch-on').forEach((el) => { ch[el.dataset.ch] = el.checked ? 'on' : 'off'; });
      base.channels = ch;
      const route = {};
      for (const s of SEVERITIES) {
        const sel = [...document.querySelectorAll(`.rt[data-sev="${s}"]`)].filter((el) => el.checked).map((el) => el.dataset.ch);
        if (sel.length) route[s] = sel;
      }
      base.route = route;
      const rr = {};
      document.querySelectorAll('.rr').forEach((el) => {
        const list = el.value.split(',').map((x) => x.trim()).filter(Boolean);
        if (list.length) rr[el.dataset.role] = list;
      });
      base.role_recipients = rr;
      base.quiet_hours = document.getElementById('qh-on')?.checked
        ? { start: Number(document.getElementById('qh-start').value), end: Number(document.getElementById('qh-end').value) }
        : null;
      const day = document.getElementById('rl-day')?.value ?? '';
      const hour = document.getElementById('rl-hour')?.value ?? '';
      base.rate_limit = (day !== '' || hour !== '')
        ? { ...(day !== '' ? { per_day: Number(day) } : {}), ...(hour !== '' ? { per_hour: Number(hour) } : {}) }
        : null;
      base.retry = Number(document.getElementById('retry')?.value || 0);
      return base;
    }

    document.getElementById('save').addEventListener('click', async () => {
      if (!current) { alert('尚未读到服务端配置，无法保存'); return; }
      try {
        await put(`/api/config/${KEYS[tab]}`, { value: collect() });
        alert(`已保存 ${KEYS[tab]}（写经决策第 0 闸）`);
        await load();
        await loadStatus();
      } catch (e) {
        document.getElementById('err').textContent = `保存失败：${e.message}`;
      }
    });

    document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
      tab = b.dataset.tab;
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
      load();
    }));

    loadStatus();
    load();
  </script>
</body>
</html>
