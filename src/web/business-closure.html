<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L2C 业务闭环 · CRM</title>
  <link rel="stylesheet" href="/portal/page.css" />
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background:var(--bg); color: var(--ink); }
  </style>
<link rel="stylesheet" href="/portal/tokens.css" />
<link rel="stylesheet" href="/portal/common.css" />
  <script type="module" src="/portal/components.js"></script>
</head>
<body>
  <div id="app" class="pg-loading">加载业务闭环看板…</div>

  <script type="module">
import { get, post, put } from '/portal/api.js';
    import { renderBusinessClosure } from '/portal/businessClosureRender.js';

    async function load() {
      const app = document.getElementById('app');
      try {
        // 用 get()（/portal/api.js）而非裸 fetch：/api/business/board 经 resolveMe 做租户隔离，
        // 裸 fetch 无 Authorization 会依赖 scopeTenant 回退（同款鉴权死区隐患，见决策链追溯页修复）。
        const data = await get('/api/business/board');
        app.className = 'pg-page';
        app.innerHTML = renderBusinessClosure(data);
      } catch (e) {
        app.className = 'pg-error';
        app.textContent = '业务闭环看板加载失败：' + (e && e.message ? e.message : e);
      }
    }

    load();
</script>

  <script type="module">
    import { injectLayout } from '/portal/layout.js';
    injectLayout();

</script>
</body>
</html>
