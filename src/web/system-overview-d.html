<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>决策系统·运行概览</title>
<link rel="stylesheet" href="/portal/tokens.css">
<link rel="stylesheet" href="/portal/common.css">
<link rel="stylesheet" href="/portal/page.css">
<script type="module" src="/portal/components.js"></script>
<style>
  .so-d-section { margin-bottom: 18px; }
  .so-d-err { color: var(--err); font-size: 12px; margin-bottom: 8px; }
  .so-d-loading { padding: 24px; text-align: center; color: var(--mut); font-size: 13px; }
</style>
</head>
<body>
<header class="page-head"><div class="ph-main"><h1 class="page-title">决策系统·运行概览</h1></div></header>
<div class="page-sub">决策系统运行概览：顶部状态条 + 近 30 日趋势 + 决策八阶段汇总卡片；下半区 L1 拦截 / L2 场景通过率 / L3 校准待批三张汇总卡（点卡下钻原明细）。监控仪表盘（只读）。</div>

<div class="so-d-err" id="so-d-err"></div>

<div id="system-overview-d-root" class="so-d-loading">决策系统运行概览加载中…</div>

  <script type="module">
  import { injectLayout } from '/portal/layout.js';
  import { api } from '/portal/api.js';
  import { bindDrill } from '/portal/drillModal.js';
  injectLayout();
  bindDrill('#system-overview-d-root');

  const root = document.getElementById('system-overview-d-root');
  const err = document.getElementById('so-d-err');

  async function load() {
    err.textContent = '';
    try {
      const r = await api('/api/page/system-overview-d');
      root.classList.remove('so-d-loading');
      root.innerHTML = r.html || '<div class="so-d-loading">暂无数据</div>';
    } catch (e) {
      err.textContent = '决策系统运行概览加载失败：' + (e?.message || e) + '（PG 未启动或端点未就绪）';
    }
  }
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
