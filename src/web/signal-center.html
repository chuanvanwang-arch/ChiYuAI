<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>销售自动化 · 主动运行时</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/portal/tokens.css">
<link rel="stylesheet" href="/portal/common.css">
<link rel="stylesheet" href="/portal/page.css">
<script type="module" src="/portal/components.js"></script>
<style>
 .sc-wrap{max-width:1120px}
 .sc-head{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
 .sc-head h2{font-size:18px;margin:0}
 .sc-sub{color:var(--mut);font-size:13px;margin-bottom:16px}
 .sc-toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
 .sc-toolbar label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
 .sc-toolbar crm-select{min-width:110px}
 .sc-toolbar select,.sc-toolbar button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px}
 .sc-table{width:100%;border-collapse:collapse;font-size:13px}
 .sc-table th,.sc-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 .sc-table th{color:var(--mut);font-weight:500;font-size:12px}
 .sc-table crm-button{margin-right:6px}
 .sev-high{color:var(--err);font-weight:600}
 .sev-medium{color:var(--warn)}
 .sev-low{color:var(--mut)}
 .muted{color:var(--mut)}
 .sc-empty{padding:22px;text-align:center;color:var(--mut)}
 .sc-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
 .sc-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
 .sc-card .k{font-size:12px;color:var(--mut);margin-bottom:6px}
 .sc-card .v{font-size:20px;font-weight:600}
 .sc-card .hint{font-size:11px;color:var(--mut);margin-top:3px}
 .sc-code{color:var(--mut);font-size:11px}
 .sc-lock{color:var(--mut);font-size:12px;margin-left:6px}
 .sc-block{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
 .sc-block h3{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:500}
 .sc-alert{border:1px solid var(--err);background:var(--err-soft);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
 .sc-down{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
 .sc-down:last-child{border-bottom:0}
 .sc-ok{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="sc-wrap" id="signal-center-root">
  <div class="sc-head">
    <!-- 显示名对齐左侧菜单「销售自动化」（2026-09-16 更名，原「信号中心」）；文件/路由/端点标识保持 signal-center 不变 -->
    <h2>销售自动化</h2>
    <span class="muted" id="scCount"></span>
  </div>
  <p class="sc-sub">系统替你盯出来的事都收在这张表里——日常巡检（拜访/信息/商机）、事件触发（客户资料变动）、情报研究。点「确认」＝我知道了，点「否决」＝这件事不用跟。</p>

  <section class="sc-toolbar">
    <label>状态
      <crm-select id="filter-status" data-signal-status>
        <option value="">全部</option>
        <option value="open">待处理</option>
        <option value="acked">已确认</option>
        <option value="closed">已否决</option>
        <option value="acted">已成单</option>
      </crm-select>
    </label>
    <label>严重度
      <crm-select id="filter-severity" data-severity>
        <option value="">全部</option>
        <option value="high">高</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </crm-select>
    </label>
    <label>类型
      <crm-select id="filter-kind" data-signal-kind>
        <option value="">全部</option>
      </crm-select>
    </label>
    <!-- T21 个人隔离：普通销售员的作用域由服务端强制（meta.enforced），页面不再给选项 -->
    <label id="scope-label">范围
      <crm-select id="filter-scope" data-scope>
        <option value="self">只看我负责的</option>
        <option value="all">全租户（管理）</option>
      </crm-select>
      <span id="scope-lock" class="sc-lock" hidden>个人隔离：仅显示我负责的</span>
    </label>
    <crm-button id="refresh" data-refresh>刷新</crm-button>
  </section>

  <section id="signal-metrics" data-signal-metrics>
    <div class="sc-metrics">
      <div class="sc-card"><div class="k">提醒送达率</div><div class="v" id="m-success">—</div><div class="hint">提醒有没有真的送到人</div></div>
      <div class="sc-card"><div class="k">平均延迟</div><div class="v" id="m-latency">—</div><div class="hint">从产生到送达花了多久</div></div>
      <div class="sc-card"><div class="k">冲突/损失</div><div class="v" id="m-conflict">—</div><div class="hint">没送成功的条数</div></div>
      <div class="sc-card"><div class="k">自治执行量</div><div class="v" id="m-exec">—</div><div class="hint">系统自己动手做了几件</div></div>
    </div>
    <div class="sc-block">
      <h3>链路健康告警（该发的提醒却没发出去 · 正常时为空）</h3>
      <div id="neg-alerts"><p class="sc-ok">暂无</p></div>
    </div>
    <div class="sc-block">
      <h3>自动动作被叫停记录（连续被否决后系统收回放权）</h3>
      <div id="down-list"><p class="sc-ok">暂无</p></div>
    </div>
  </section>

  <table class="sc-table" id="signal-table" data-signal-table>
    <thead>
      <tr><th>事项</th><th>紧急度</th><th>对象</th><th>说明</th><th>时间</th><th>租户</th><th>动作</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="sc-empty" id="scEmpty" hidden>当前筛选条件下没有信号。</p>
  <p class="sc-sub">「采纳（转成单行动）」在 S3 建议卡回路交付后启用，当前置灰不造假绿。</p>
</div>

<script type="module">
import { injectLayout } from '/portal/layout.js';
// 展示层单源（2026-09-17 前台可见性审计）：中文化 + 摘要一律取自 /portal/signalLabels.js
//   —— 页面此前自建了一份内联 KIND_TEXT/SEV_TEXT/summarizer，与 portal 模块**重复**（违单源铁律），
//   新增 kind 时两处都要改，漏改一处即直出英文码（contact_change 等 4 个新 kind 正是这样漏掉的）。
//   ⚠ 别删这行 import：删掉它（= 回到内联副本）会让守门测试 test/web/signalCenterPage.test.js 转红。
import {
  kindLabel, severityLabel, statusLabel,
  summarizeSignal, scopeLabel, scopeTitle, kindTitle,
} from '/portal/signalLabels.js';

// 鉴权对齐既有页面范式（lead-pool / today-priority）：Bearer token 走 Authorization 头。
// ⚠ 不再使用 x-tenant-id 头——resolveMe 只认 token（src/http/auth.js:57），该头从不被读取，
//    曾导致全部请求回落 system 租户（登录用户看不到本租户信号 = 假象）。
const token = localStorage.getItem('crm_token');
if (!token) location.href = '/home.html';
injectLayout();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const authHeaders = () => ({ Authorization: `Bearer ${token}` });

// 展示层中文化（2026-09-17 单源化）：原内联 STATUS_TEXT / SEV_TEXT / KIND_TEXT 已**删除**，
//   一律改用 /portal/signalLabels.js 的 statusLabel / severityLabel / kindLabel。
//   迁移理由：两处映射=两处解释权（判据⑥），2026-09-17 审计实证新 kind 漏登记致页面显示英文码。
const REASON_TEXT = { 'consecutive-rejects': '连续被人否决', 'usage-limit': '用量超限' };
const shortId = (v) => (typeof v === 'string' && v.length > 12 ? v.slice(0, 8) : v);
// payload 里常带长 UUID（如 suggestion_card 的 subject），展示时截断，避免一屏全是乱码
const tidy = (t) => String(t || '').replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, (m) => m.slice(0, 8));

// 说明列改用单源 summarizeSignal（见上方 import）：它按各 kind 的**真实 payload/evidence 形状**
//   生成可读句子，并在确实无明细时诚实返回「暂无明细」（不拿类型名冒充摘要）。
//   JSONB 空对象（[object Object]）与长 UUID 由模块内类型闸 + 此处 tidy 兜底。
//   ⚠ 不再自建 summaryOf/asText——内联副本是单源破窗（新增 kind 时两处漏改即直出英文码）。

// T21 个人隔离：作用域 UI（2026-09-16 用户指令「除管理外，需要进行个人隔离！」）
//   enforced=true（普通销售员）→ 服务端已强制收窄，隐藏选择器并明示「仅显示我负责的」
//   enforced=false（管理员）   → 显示「全租户 / 只看我的」切换
// 提示带上当前视图者，便于回答「为什么我看不到某条信号」
function applyScopeUi(meta) {
  const sel = $('filter-scope');
  const lock = $('scope-lock');
  if (!sel || !lock) return;
  const enforced = meta.enforced === true;
  sel.style.display = enforced ? 'none' : '';
  lock.hidden = !enforced;
  if (enforced) lock.textContent = meta.viewer ? `个人隔离：仅显示 ${meta.viewer} 负责的` : '个人隔离：仅显示我负责的';
}

async function load() {
  const status = $('filter-status').value;
  const severity = $('filter-severity').value;
  const kind = $('filter-kind').value;
  const q = new URLSearchParams();
  if (status) q.set('status', status);
  if (severity) q.set('severity', severity);
  if (kind) q.set('kind', kind);
  // T21 个人隔离：scope=self 时请求收窄到「我负责的」。
  //   ⚠ 这只是意图声明——服务端对普通用户强制收窄，伪造 mine 参数无法放宽（见 tenantScope.signalOwnerScope）
  if (($('filter-scope')?.value || 'self') === 'self') q.set('mine', '1');

  const res = await fetch(`/api/signals?${q}`, { headers: authHeaders() });
  if (!res.ok) {
    document.querySelector('#signal-table tbody').innerHTML =
      `<tr><td colspan="7" class="muted">加载失败：HTTP ${res.status}</td></tr>`;
    return;
  }
  const data = await res.json().catch(() => ({ items: [] }));
  const items = Array.isArray(data.items) ? data.items : [];
  applyScopeUi(data.meta || {});

  $('scCount').textContent = `${items.length} 条`;
  $('scEmpty').hidden = items.length > 0;

  const tbody = document.querySelector('#signal-table tbody');
  tbody.innerHTML = '';
  for (const s of items) {
    const tr = document.createElement('tr');
    const actBtn = s.status === 'open'
      ? `<crm-button class="btn" data-ack="${esc(s.signal_id)}">确认</crm-button> <crm-button class="btn" data-close="${esc(s.signal_id)}">否决</crm-button>`
      : `<span class="muted">${esc(statusLabel(s.status))}</span>`;
    // P0-2 日历入口（2026-09-17 前台可见性审计）：仅对**带日期语义**的信号（payload.event_at）显示
    //   —— buildIcs 缺日期返回 null（不造幽灵日程），无日期却给按钮只会得到 404 = 假入口。
    const icsBtn = typeof s.payload?.event_at === 'string' && s.payload.event_at.trim()
      ? ` <crm-button class="btn" data-ics="${esc(s.signal_id)}">加入日历</crm-button>` : '';
    tr.innerHTML = `
      <td title="${esc(kindTitle(s.kind))}">${esc(kindLabel(s.kind))}<div class="sc-code">${esc(s.kind || '')}</div></td>
      <td class="sev-${esc(s.severity || 'low')}">${esc(severityLabel(s.severity))}</td>
      <td title="${esc(scopeTitle(s))}">${esc(scopeLabel(s))}</td>
      <td title="${esc(JSON.stringify(s.payload || {}))}">${esc(tidy(summarizeSignal(s)).slice(0, 48))}</td>
      <td>${s.created_at ? esc(new Date(s.created_at).toLocaleString()) : ''}</td>
      <td class="sc-code">${esc(s.tenant_id || '—')}</td>
      <td>${actBtn}${icsBtn}</td>`;
    tbody.appendChild(tr);
  }
  fillKindFilter(items);
}

// 类型下拉按当前结果集动态填充（避免硬编码 kind 清单与后端漂移）
function fillKindFilter(items) {
  const sel = $('filter-kind');
  if (sel.dataset.filled === '1') return;
  const kinds = [...new Set(items.map((s) => s.kind).filter(Boolean))].sort();
  for (const k of kinds) {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = kindLabel(k);
    sel.appendChild(o);
  }
  // 空结果不得上锁：首载为 0 条时若直接置 filled，后续数据出现也不会再补齐（2026-09-16 实测实坑）
  if (kinds.length) sel.dataset.filled = '1';
}

// 确认/否决：POST 状态变更端点（写 crm.signal，租户取自身——写不跨租户）
async function act(signalId, action) {
  const path = `/api/signals/${signalId}/${action === 'ack' ? 'ack' : 'close'}`;
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) {
    alert(`操作失败：${data.error || res.status}`);
    return;
  }
  load();
}

// P0-2 日历下载（2026-09-17 前台可见性审计）：GET /api/signals/:id/ics 走 Bearer 鉴权，
//   <a download href> 不会带 Authorization 头 ⇒ 必须 fetch 取 blob 再触发下载。
//   失败不静默：非 2xx 明确提示（含后端 not_a_calendar_signal 语义）。
async function downloadIcs(signalId) {
  const res = await fetch(`/api/signals/${signalId}/ics`, { headers: authHeaders() });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    alert(`日历下载失败：${d.error || `HTTP ${res.status}`}`);
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `signal-${signalId}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// T20 链路观测上墙：指标卡 + 负向判据 + 降级事件（per-tenant，取自身 token 租户）
async function loadMetrics() {
  const res = await fetch('/api/monitor/signal-link', { headers: authHeaders() });
  if (!res.ok) return;
  const d = await res.json().catch(() => ({}));
  const m = d.metrics || {};
  $('m-success').textContent = m.delivery_success_rate == null ? '无投递' : `${Math.round(m.delivery_success_rate * 100)}%`;
  $('m-latency').textContent = m.avg_latency_ms == null ? '—' : `${Math.round(m.avg_latency_ms)} ms`;
  $('m-conflict').textContent = String(m.conflict ?? 0);
  $('m-exec').textContent = String(m.execution_volume ?? 0);

  const neg = Array.isArray(d.negative_predicates) ? d.negative_predicates : [];
  // ⚠ 判据文案必须与判据语义**一对一**（2026-09-17 修实体缺陷）。
  //   原实现只有 delivery_silent 一个分支，其余一律套用「外部事件命中 N 次，系统却一条提醒都没生成」
  //   —— 于是 signalMetrics 的 `delivery_undelivered`（渠道尝试过但 0 送达，字段是 attempted/top_error）
  //   被误述为「零提醒生成」（字段是 fired）⇒ 运维看到的是**错误的故障归因**，
  //   且 `a.fired` 为 undefined 时还会渲染出字面量 "undefined"。
  //   实测（demo-datadriven，2026-09-17）：API 返回 2 条 delivery_undelivered
  //   （im attempted=3、email attempted=4，top_error 均为 retry_exhausted），页面却无法描述它们。
  //   未知类型**必须原样暴露**，不得借用其它判据的文案——套用文案正是本缺陷的成因。
  const NEG_TEXT = {
    delivery_silent: (a) => `提醒没送出去：渠道「${esc(a.channel)}」已开启，但窗口内一条都没发出去`,
    delivery_undelivered: (a) => `渠道「${esc(a.channel)}」尝试 ${esc(a.attempted)} 次、送达 0 次`
      + `${a.top_error ? `（最近失败：${esc(a.top_error)}${a.top_error_count ? ` ×${esc(a.top_error_count)}` : ''}）` : ''}`,
    gen_silent: (a) => `外部事件命中 ${esc(a.fired)} 次，系统却一条提醒都没生成`,
  };
  $('neg-alerts').innerHTML = neg.length ? neg.map((a) => {
    const fn = NEG_TEXT[a.type];
    const label = fn ? fn(a) : `未知负向判据「${esc(a.type)}」：${esc(JSON.stringify(a))}`;
    return `<div class="sc-alert">${label}</div>`;
  }).join('') : '<p class="sc-ok">暂无</p>';

  const paused = d.downgrades?.paused_grants || [];
  $('down-list').innerHTML = paused.length ? paused.map((g) =>
    `<div class="sc-down">自动执行凭证「${esc(g.title || shortId(g.grant_id) || '—')}」已被暂停（原因：${esc(REASON_TEXT[g.paused_reason] || g.paused_reason || '—')}）· ${g.paused_at ? esc(new Date(g.paused_at).toLocaleString()) : ''}</div>`
  ).join('') : '<p class="sc-ok">暂无</p>';
}

$('refresh').addEventListener('click', () => { load(); loadMetrics(); });
$('filter-status').addEventListener('change', load);
$('filter-severity').addEventListener('change', load);
$('filter-kind').addEventListener('change', load);
$('filter-scope')?.addEventListener('change', load);
$('signal-table').addEventListener('click', (e) => {
  const ack = e.target.closest('[data-ack]');
  const close = e.target.closest('[data-close]');
  const ics = e.target.closest('[data-ics]');
  if (ack) act(ack.dataset.ack, 'ack');
  else if (close) act(close.dataset.close, 'close');
  else if (ics) downloadIcs(ics.dataset.ics);
});
load();
loadMetrics();
</script>
</body>
</html>
