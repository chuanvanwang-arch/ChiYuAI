<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>销售自动化 · 主动运行时</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/portal/tokens.css">
<link rel="stylesheet" href="/portal/common.css">
<link rel="stylesheet" href="/portal/page.css">
<style>
 .sc-wrap{max-width:1120px}
 .sc-head{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
 .sc-head h2{font-size:18px;margin:0}
 .sc-sub{color:var(--mut);font-size:13px;margin-bottom:16px}
 .sc-toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
 .sc-toolbar label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
 .sc-toolbar select,.sc-toolbar button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
 .sc-table{width:100%;border-collapse:collapse;font-size:13px}
 .sc-table th,.sc-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 .sc-table th{color:var(--mut);font-weight:500;font-size:12px}
 .sc-table button{padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;cursor:pointer}
 .sc-table button:hover{border-color:var(--acc)}
 .sev-high{color:#dc2626;font-weight:600}
 .sev-medium{color:#d97706}
 .sev-low{color:var(--mut)}
 .muted{color:var(--mut)}
 .sc-empty{padding:22px;text-align:center;color:var(--mut)}
 .sc-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
 .sc-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
 .sc-card .k{font-size:12px;color:var(--mut);margin-bottom:6px}
 .sc-card .v{font-size:20px;font-weight:600}
 .sc-card .hint{font-size:11px;color:var(--mut);margin-top:3px}
 .sc-code{color:var(--mut);font-size:11px}
 .sc-block{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
 .sc-block h3{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:500}
 .sc-alert{border:1px solid #dc2626;background:rgba(220,38,38,.08);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
 .sc-down{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
 .sc-down:last-child{border-bottom:0}
 .sc-ok{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="sc-wrap" id="signal-center-root">
  <div class="sc-head">
    <!-- 显示名对齐左侧菜单「销售自动化」（2026-09-16 更名，原「信号中心」）；文件/路由/端点标识保持 signal-center 不变 -->
    <h2>销售自动化</h2>
    <span class="muted" id="scCount"></span>
  </div>
  <p class="sc-sub">系统替你盯出来的事都收在这张表里——日常巡检（拜访/信息/商机）、事件触发（客户资料变动）、情报研究。点「确认」＝我知道了，点「否决」＝这件事不用跟。</p>

  <section class="sc-toolbar">
    <label>状态
      <select id="filter-status" data-signal-status>
        <option value="">全部</option>
        <option value="open">待处理</option>
        <option value="acked">已确认</option>
        <option value="closed">已否决</option>
        <option value="acted">已成单</option>
      </select>
    </label>
    <label>严重度
      <select id="filter-severity" data-severity>
        <option value="">全部</option>
        <option value="high">高</option>
        <option value="medium">中</option>
        <option value="low">低</option>
      </select>
    </label>
    <label>类型
      <select id="filter-kind" data-signal-kind>
        <option value="">全部</option>
      </select>
    </label>
    <button id="refresh" data-refresh>刷新</button>
  </section>

  <section id="signal-metrics" data-signal-metrics>
    <div class="sc-metrics">
      <div class="sc-card"><div class="k">提醒送达率</div><div class="v" id="m-success">—</div><div class="hint">提醒有没有真的送到人</div></div>
      <div class="sc-card"><div class="k">平均延迟</div><div class="v" id="m-latency">—</div><div class="hint">从产生到送达花了多久</div></div>
      <div class="sc-card"><div class="k">冲突/损失</div><div class="v" id="m-conflict">—</div><div class="hint">没送成功的条数</div></div>
      <div class="sc-card"><div class="k">自治执行量</div><div class="v" id="m-exec">—</div><div class="hint">系统自己动手做了几件</div></div>
    </div>
    <div class="sc-block">
      <h3>链路健康告警（该发的提醒却没发出去 · 正常时为空）</h3>
      <div id="neg-alerts"><p class="sc-ok">暂无</p></div>
    </div>
    <div class="sc-block">
      <h3>自动动作被叫停记录（连续被否决后系统收回放权）</h3>
      <div id="down-list"><p class="sc-ok">暂无</p></div>
    </div>
  </section>

  <table class="sc-table" id="signal-table" data-signal-table>
    <thead>
      <tr><th>事项</th><th>紧急度</th><th>对象</th><th>说明</th><th>时间</th><th>动作</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="sc-empty" id="scEmpty" hidden>当前筛选条件下没有信号。</p>
  <p class="sc-sub">「采纳（转成单行动）」在 S3 建议卡回路交付后启用，当前置灰不造假绿。</p>
</div>

<script type="module">
import { injectLayout } from '/portal/layout.js';

// 鉴权对齐既有页面范式（lead-pool / today-priority）：Bearer token 走 Authorization 头。
// ⚠ 不再使用 x-tenant-id 头——resolveMe 只认 token（src/http/auth.js:57），该头从不被读取，
//    曾导致全部请求回落 system 租户（登录用户看不到本租户信号 = 假象）。
const token = localStorage.getItem('crm_token');
if (!token) location.href = '/home.html';
injectLayout();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const authHeaders = () => ({ Authorization: `Bearer ${token}` });

const STATUS_TEXT = { open: '待处理', acked: '已确认', closed: '已否决', acted: '已成单' };

// 展示层中文化（2026-09-16）：页面是给人看的，不再直出后端代码。
// 鉴别力：kind 未登记时回落原文——宁可见代码，也不静默显示空白（防「看起来都对」的假绿）。
const SEV_TEXT = { high: '高', medium: '中', low: '低' };
const KIND_TEXT = {
  // src/alerts/alertRegistry.js 的 13 个登记 kind（守门断言见 test/web/signalCenterPage.test.js）
  deal_stuck: '商机停滞',
  lead_overdue: '线索跟进逾期',
  forecast_breach: '预测缺口',
  approval_bottleneck: '审批积压',
  payment_due: '回款到期',
  payment_gap: '应收差额超限',
  payment_due_plan: '回款计划逾期',
  coverage_gap: '目标客户覆盖缺口',
  lost_contact: '客户接触流失警戒',
  funnel_unhealthy: '漏斗不健康',
  commit_red: '承诺准确率红带',
  funnel_jitter: '漏斗抖动超标',
  named_visit_overdue: '指名拜访逾期',
  // 扫描器/事件源产出的 kind
  s0_stale: '公海线索滞留',
  visit_shortfall: '拜访量不达标',
  info_collect_lag: '客户信息缺失',
  object_changed: '客户资料变动',
  suggestion_card: '研究建议卡',
  'signal-observability': '链路断链告警',
};
const REASON_TEXT = { 'consecutive-rejects': '连续被人否决', 'usage-limit': '用量超限' };
const shortId = (v) => (typeof v === 'string' && v.length > 12 ? v.slice(0, 8) : v);
// payload 里常带长 UUID（如 suggestion_card 的 subject），展示时截断，避免一屏全是乱码
const tidy = (t) => String(t || '').replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, (m) => m.slice(0, 8));

// 说明列：优先用 payload 里的业务量（滞留天数/逾期天数/拜访缺口），
// 退回到 subject——否则只会显示「s0_stale 预警」这类零信息量的句子。
function summaryOf(s) {
  const p = s.payload || {};
  if (p.ageDays != null) return `公海已滞留 ${p.ageDays} 天，仍无人认领`;
  if (p.overdueDays != null) return `逾期 ${p.overdueDays} 天${p.named_owner ? `（责任人 ${p.named_owner}）` : ''}`;
  if (p.dailyVisits != null && p.dailyTarget != null) return `今日拜访 ${p.dailyVisits} 次 / 目标 ${p.dailyTarget} 次`;
  if (p.weekNew != null && p.weeklyMin != null) return `本周新增 ${p.weekNew} 条 / 目标 ${p.weeklyMin} 条`;
  const sub = tidy(p.subject || s.suggestion || '');
  return sub || KIND_TEXT[s.kind] || s.kind || '';
}

async function load() {
  const status = $('filter-status').value;
  const severity = $('filter-severity').value;
  const kind = $('filter-kind').value;
  const q = new URLSearchParams();
  if (status) q.set('status', status);
  if (severity) q.set('severity', severity);
  if (kind) q.set('kind', kind);

  const res = await fetch(`/api/signals?${q}`, { headers: authHeaders() });
  if (!res.ok) {
    document.querySelector('#signal-table tbody').innerHTML =
      `<tr><td colspan="6" class="muted">加载失败：HTTP ${res.status}</td></tr>`;
    return;
  }
  const data = await res.json().catch(() => ({ items: [] }));
  const items = Array.isArray(data.items) ? data.items : [];

  $('scCount').textContent = `${items.length} 条`;
  $('scEmpty').hidden = items.length > 0;

  const tbody = document.querySelector('#signal-table tbody');
  tbody.innerHTML = '';
  for (const s of items) {
    const p = s.payload || {};
    const tr = document.createElement('tr');
    const actBtn = s.status === 'open'
      ? `<button data-ack="${esc(s.signal_id)}">确认</button> <button data-close="${esc(s.signal_id)}">否决</button>`
      : `<span class="muted">${STATUS_TEXT[s.status] || s.status}</span>`;
    // 对象列优先显示业务可读标识（external_id），退化到 ID 前 8 位，鼠标悬停可见完整 ID
    const objText = p.external_id || shortId(s.particle_id) || '—';
    tr.innerHTML = `
      <td>${esc(KIND_TEXT[s.kind] || s.kind || '')}<div class="sc-code">${esc(s.kind || '')}</div></td>
      <td class="sev-${esc(s.severity || 'low')}">${esc(SEV_TEXT[s.severity] || s.severity || '')}</td>
      <td title="${esc(s.particle_id || '')}">${esc(objText)}</td>
      <td title="${esc(JSON.stringify(s.payload || {}))}">${esc(summaryOf(s).slice(0, 48))}</td>
      <td>${s.created_at ? esc(new Date(s.created_at).toLocaleString()) : ''}</td>
      <td>${actBtn}</td>`;
    tbody.appendChild(tr);
  }
  fillKindFilter(items);
}

// 类型下拉按当前结果集动态填充（避免硬编码 kind 清单与后端漂移）
function fillKindFilter(items) {
  const sel = $('filter-kind');
  if (sel.dataset.filled === '1') return;
  const kinds = [...new Set(items.map((s) => s.kind).filter(Boolean))].sort();
  for (const k of kinds) {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = KIND_TEXT[k] || k;
    sel.appendChild(o);
  }
  sel.dataset.filled = '1';
}

// 确认/否决：POST 状态变更端点（写 crm.signal，租户取自身——写不跨租户）
async function act(signalId, action) {
  const path = `/api/signals/${signalId}/${action === 'ack' ? 'ack' : 'close'}`;
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) {
    alert(`操作失败：${data.error || res.status}`);
    return;
  }
  load();
}

// T20 链路观测上墙：指标卡 + 负向判据 + 降级事件（per-tenant，取自身 token 租户）
async function loadMetrics() {
  const res = await fetch('/api/monitor/signal-link', { headers: authHeaders() });
  if (!res.ok) return;
  const d = await res.json().catch(() => ({}));
  const m = d.metrics || {};
  $('m-success').textContent = m.delivery_success_rate == null ? '无投递' : `${Math.round(m.delivery_success_rate * 100)}%`;
  $('m-latency').textContent = m.avg_latency_ms == null ? '—' : `${Math.round(m.avg_latency_ms)} ms`;
  $('m-conflict').textContent = String(m.conflict ?? 0);
  $('m-exec').textContent = String(m.execution_volume ?? 0);

  const neg = Array.isArray(d.negative_predicates) ? d.negative_predicates : [];
  $('neg-alerts').innerHTML = neg.length ? neg.map((a) => {
    const label = a.type === 'delivery_silent'
      ? `提醒没送出去：渠道「${esc(a.channel)}」已开启，但窗口内一条都没发出去`
      : `外部事件命中 ${esc(a.fired)} 次，系统却一条提醒都没生成`;
    return `<div class="sc-alert">${label}</div>`;
  }).join('') : '<p class="sc-ok">暂无</p>';

  const paused = d.downgrades?.paused_grants || [];
  $('down-list').innerHTML = paused.length ? paused.map((g) =>
    `<div class="sc-down">自动执行凭证「${esc(g.title || shortId(g.grant_id) || '—')}」已被暂停（原因：${esc(REASON_TEXT[g.paused_reason] || g.paused_reason || '—')}）· ${g.paused_at ? esc(new Date(g.paused_at).toLocaleString()) : ''}</div>`
  ).join('') : '<p class="sc-ok">暂无</p>';
}

$('refresh').addEventListener('click', () => { load(); loadMetrics(); });
$('filter-status').addEventListener('change', load);
$('filter-severity').addEventListener('change', load);
$('filter-kind').addEventListener('change', load);
$('signal-table').addEventListener('click', (e) => {
  const ack = e.target.closest('[data-ack]');
  const close = e.target.closest('[data-close]');
  if (ack) act(ack.dataset.ack, 'ack');
  else if (close) act(close.dataset.close, 'close');
});
load();
loadMetrics();
</script>
</body>
</html>
