<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务看板 · L2C 全链路 · CRM</title>
  <!-- 统一设计系统：layout 壳 + tokens/common/page（受控渲染产物样式） -->
  <link rel="stylesheet" href="/portal/tokens.css" />
  <link rel="stylesheet" href="/portal/common.css" />
  <link rel="stylesheet" href="/portal/page.css" />
  <script type="module" src="/portal/components.js"></script>
</head>
<body>
  <script type="module">
import { get, post, put } from '/portal/api.js';
    import { injectLayout } from '/portal/layout.js';
    injectLayout();
  
</script>

  <main class="portal-shell">
    <header class="page-head">
      <h1>业务看板 · L2C 全链路</h1>
      
    </header>
    <section id="board-root" class="portal-content">
      <div class="pg-loading">加载业务看板…</div>
    </section>
  </main>

  <script type="module">
    (async () => {
      try {
        const focus = new URLSearchParams(location.search).get('focus') || '';
        const bbUrl = '/api/page/business-board' + (focus ? `?focus=${encodeURIComponent(focus)}` : '');
        const res = await fetch(bbUrl, { headers: { Authorization: `Bearer ${localStorage.getItem('crm_token') || ''}` } });
        const j = await res.json();
        const root = document.getElementById('board-root');
        if (!res.ok || !j.html) { root.innerHTML = `<div class="pg-empty">业务看板加载失败：${j.error || '未知错误'}</div>`; return; }
        root.innerHTML = j.html;
      } catch (e) {
        document.getElementById('board-root').innerHTML = `<div class="pg-error">渲染错误：${e.message}</div>`;
      }
    })();

</script>
</body>
</html>
