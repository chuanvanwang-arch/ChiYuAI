<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RBAC 矩阵 · 配置中心</title>
<style>
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; margin: 0; background:var(--bg); color: var(--ink); }
  header { background: var(--panel); color:#fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; }
  .sub { font-size: 12px; opacity: .8; }
  .wrap { padding: 18px 20px; max-width: 1280px; margin: 0 auto; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  button { background: var(--panel); color:#fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  button.sec { background: var(--mut); }
  button:hover { opacity: .9; }
  #status { font-size: 12px; color: var(--mut); }
  table.rbac-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.rbac-table th, table.rbac-table td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: center; }
  table.rbac-table thead th { background: var(--panel)2f7; position: sticky; top: 0; }
  table.rbac-table th.pcol { background: var(--line); font-size: 11px; writing-mode: horizontal-tb; }
  table.rbac-table td.role { text-align: left; font-weight: 600; background: var(--panel); }
  td.model select { padding: 3px 4px; }
  td.cell.all { background: var(--ok); }
  td.cell.na { background: var(--line); color: var(--mut); }
  .legend { font-size: 12px; color: var(--mut); margin: 6px 0 0; }
  .note { background: var(--warn); border: 1px solid var(--warn); color:#fff; padding: 10px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; }
</style>
  <link rel="stylesheet" href="/portal/tokens.css">
  <link rel="stylesheet" href="/portal/common.css">
  <script type="module" src="/portal/components.js"></script>
</head>
<body>
<header class="page-head"><div class="ph-main"><h1 class="page-title">RBAC 矩阵</h1></div></header>
<div class="wrap">
  <div class="note">说明：范围模型 <b>self</b>=仅本人 / <b>org_subtree</b>=团队子树 / <b>all</b>=全量 / <b>domain</b>=勾选授权粒子域。修改后点「保存全部变更」，写操作经决策第0闸（无决策不写）。短别名（payment/contract/invoice）保存时自动归一为 canonical CRM_* 名。</div>
  <div class="panel">
    <div class="toolbar">
      <crm-button id="saveBtn">保存全部变更</crm-button>
      <crm-button class="sec" id="reloadBtn">重新加载</crm-button>
      <span id="status">就绪</span>
    </div>
    <div id="matrix" class="empty">加载中…</div>
    <p class="legend">✓ 授权 / ⚪ 不适用 / 全量行禁用勾选</p>
  </div>
</div>

<script type="module">
import { get, post, put } from '/portal/api.js';
  import { renderRbacMatrix } from '/portal/rbacMatrixRender.js';

  let current = { profiles: [], particles: [] };

  async function load() {
    const d = await get('/api/rbac');
    current = d;
    document.getElementById('matrix').innerHTML = renderRbacMatrix(d.profiles, d.particles);
    document.getElementById('status').textContent = `已加载 ${d.profiles.length} 个角色`;
  }

  // 收集页面模型选择 + domain 勾选 → 构造 PUT payload 列表
  function collect() {
    const rows = [...document.querySelectorAll('tr.rbac-row')];
    return rows.map((tr) => {
      const role = tr.getAttribute('data-role');
      const model = tr.querySelector('.model-sel')?.value;
      if (model !== 'domain') return { role_tag: role, model };
      const domain = [...tr.querySelectorAll('.domain-chk:checked')].map((c) => c.getAttribute('data-particle'));
      return { role_tag: role, model, domain };
    });
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const payloads = collect();
    if (!confirm(`确认保存 ${payloads.length} 个角色的数据范围配置？（写操作经决策第0闸）`)) return;
    let ok = 0, fail = 0;
    for (const p of payloads) {
      try { await put('/api/rbac', p); ok++; } catch { fail++; }
    }
    document.getElementById('status').textContent = `保存完成：成功 ${ok} / 失败 ${fail}`;
    if (fail === 0) await load();
  });

  document.getElementById('reloadBtn').addEventListener('click', load);

  load();
</script>

<script type="module">
    import { injectLayout } from '/portal/layout.js';
    injectLayout();

</script>
</body>
</html>
