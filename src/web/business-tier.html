<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>业务分级配置 · CRM</title>
<style>
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; margin: 0; background:var(--bg); color: var(--ink); }
  header { background: var(--panel); color:#fff; padding: 14px 22px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  .wrap { max-width: 1000px; margin: 18px auto; padding: 0 18px; }
  .sub { color: var(--mut); font-size: 13px; margin: 4px 0 0; }
  .tier-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .tier-table th, .tier-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--panel)1f5; font-size: 14px; }
  .tier-table th { color: var(--mut); font-weight: 600; background: var(--panel); }
  .form-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 8px; }
  .form-row label { font-size: 12px; color: var(--mut); display: block; margin-bottom: 3px; }
  select, input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
  button { background: var(--panel); color:#fff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button:hover { background: var(--panel); }
  .empty { color: var(--mut); padding: 14px; text-align: center; font-size: 14px; }
  .tier-badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .tier-high { background: var(--err); color: var(--err); }
  .tier-normal { background: var(--warn); color:#fff; }
  .tier-lead { background: var(--panel)1f5; color: var(--mut); }
  .msg { margin-top: 10px; font-size: 13px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel); border-radius: 10px; padding: 20px 24px; max-width: 420px; }
  .modal h3 { margin: 0 0 8px; }
  .modal p { color: var(--mut); font-size: 14px; }
  .modal .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .btn-ghost { background: var(--panel)1f5; color: var(--ink); }
</style>
<link rel="stylesheet" href="/portal/tokens.css" />
<link rel="stylesheet" href="/portal/common.css" />
  <script type="module" src="/portal/components.js"></script>
</head>
<body>
<header class="page-head"><div class="ph-main"><h1 class="page-title">业务分级配置</h1></div></header>
<div class="wrap">
  <div class="card">
    <strong>当前分级规则</strong>
    <p class="sub">引擎 computeBusinessTier 按两维取高风险优先（HIGH &gt; NORMAL &gt; LEAD）；无配置回退 scenario.default_tier</p>
    <div id="tierList">加载中…</div>
  </div>
  <div class="card">
    <strong>新增 / 修改分级</strong>
    <p class="sub">UPSERT：相同 维度+取值 将被更新。依据决策第0闸，保存将记录决策事件。</p>
    <div class="form-row">
      <div><label>维度</label><crm-select id="f-dimension">
        <option value="customer">customer（客户维）</option>
        <option value="project">project（项目维）</option>
      </crm-select></div>
      <div><label>取值</label><crm-input id="f-value" placeholder="如：战略客户 / 百万级" style="min-width:180px" ></crm-input></div>
      <div><label>分级</label><crm-select id="f-tier">
        <option value="LEAD">LEAD（低）</option>
        <option value="NORMAL">NORMAL（中）</option>
        <option value="HIGH">HIGH（高）</option>
      </crm-select></div>
      <crm-button id="btn-save">保存</crm-button>
    </div>
    <div id="msg" class="msg"></div>
  </div>
</div>
<div class="modal-mask" id="modal">
  <div class="modal">
    <h3>确认保存分级配置</h3>
    <p id="modal-body"></p>
    <div class="acts">
      <crm-button class="btn-ghost" id="modal-cancel">取消</crm-button>
      <crm-button id="modal-ok">确认写入</crm-button>
    </div>
  </div>
</div>
<script type="module">
import { get, post, put } from '/portal/api.js';
  import { renderBusinessTier } from '/portal/businessTierRender.js';

  const $ = (id) => document.getElementById(id);
  const msg = (t, cls) => { $('msg').textContent = t; $('msg').className = 'msg ' + cls; };

  async function load() {
    try {
      const d = await get('/api/business-tier-config');
      $('tierList').innerHTML = renderBusinessTier(d.rows || []);
    } catch (e) {
      $('tierList').innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
    }
  }

  function pendingPayload() {
    return {
      dimension: $('f-dimension').value,
      dimension_value: $('f-value').value.trim(),
      tier: $('f-tier').value,
    };
  }

  $('btn-save').addEventListener('click', () => {
    const p = pendingPayload();
    if (!p.dimension_value) { msg('取值必填', 'err'); return; }
    $('modal-body').textContent = `维度=${p.dimension}，取值=${p.dimension_value}，分级=${p.tier}。保存将写入 business_tier_config 并记录决策事件。`;
    $('modal').classList.add('show');
  });

  $('modal-cancel').addEventListener('click', () => $('modal').classList.remove('show'));
  $('modal-ok').addEventListener('click', async () => {
    $('modal').classList.remove('show');
    const p = pendingPayload();
    try {
      const d = await put('/api/business-tier-config', p);
      msg('已保存（decision=' + (d.decision || '事件已记录') + '）', 'ok');
      $('f-value').value = '';
      load();
    } catch (e) { msg('保存异常：' + e.message, 'err'); }
  });

  load();
</script>

  <script type="module">
    import { injectLayout } from '/portal/layout.js';
    injectLayout();

</script>
</body>
</html>
