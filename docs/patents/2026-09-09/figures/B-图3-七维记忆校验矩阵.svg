  <rect x="190" y="340" width="115" height="46" fill="#fff" stroke="#000"/><text x="247" y="368" text-anchor="middle">●</text>
  <rect x="305" y="340" width="115" height="46" fill="#fff" stroke="#000"/><text x="362" y="368" text-anchor="middle">●</text>
  <rect x="420" y="340" width="115" height="46" fill="#fff" stroke="#000"/><text x="477" y="368" text-anchor="middle">●</text>
