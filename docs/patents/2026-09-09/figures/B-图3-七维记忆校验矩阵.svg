  <rect x="420" y="110" width="115" height="46" fill="#fff" stroke="#000"/><text x="477" y="138" text-anchor="middle">●</text>
  <rect x="535" y="110" width="125" height="46" fill="#fff" stroke="#000"/><text x="597" y="138" text-anchor="middle">●</text>

