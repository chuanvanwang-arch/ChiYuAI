<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="sans-serif" font-size="13" fill="#000">
  <rect x="0" y="0" width="680" height="470" fill="#fff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">图 3  七维记忆完整性校验矩阵</text>
  <text x="20" y="46" font-size="11" fill="#444">作用对象＝记忆内容自身（区别于“七维×七边”决策校验矩阵，后者作用于决策事件边关系）</text>

