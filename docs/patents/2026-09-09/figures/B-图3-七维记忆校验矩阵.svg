  <rect x="305" y="202" width="115" height="46" fill="#fff" stroke="#000"/><text x="362" y="230" text-anchor="middle">●</text>
  <rect x="420" y="202" width="115" height="46" fill="#fff" stroke="#000"/><text x="477" y="230" text-anchor="middle">●</text>
