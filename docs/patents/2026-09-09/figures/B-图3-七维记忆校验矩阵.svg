  <rect x="190" y="156" width="115" height="46" fill="#fff" stroke="#000"/><text x="247" y="184" text-anchor="middle">●</text>
  <rect x="305" y="156" width="115" height="46" fill="#fff" stroke="#000"/><text x="362" y="184" text-anchor="middle">●</text>
  <rect x="420" y="156" width="115" height="46" fill="#fff" stroke="#000"/><text x="477" y="184" text-anchor="middle">●</text>
  <rect x="535" y="156" width="125" height="46" fill="#fff" stroke="#000"/><text x="597" y="184" text-anchor="middle">●</text>

