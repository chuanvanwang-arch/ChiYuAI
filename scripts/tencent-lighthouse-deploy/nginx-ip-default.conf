# 裸 IP 访问兜底（2026-09-06）：certbot 的 80 端口块只匹配 chiyuai.com，
# 未匹配 host（如 81.70.184.198）会落到其 return 404 导致 404 Not Found。
# 放 conf.d（deploy.sh 只重写 sites-available/crm），故可跨 release 保留。
#
# ── 2026-09-15 变更（MCP OAuth 上线）────────────────────────────────────────
# ① /mcp 移除 auth_basic。
#    根因：连接器发 Authorization: Bearer，auth_basic 要 Authorization: Basic，
#    同一 HTTP 头互斥 → 请求在网关层 401，永远到不了应用层（所有人连不上生产的真因）。
#    认证改由应用层 Bearer 校验（src/mcp/httpAuth.js HTTP 层 401 闸）。
#    ⚠️ 若在此恢复 auth_basic，OAuth 的 access_token 同样走 Bearer，会被一起拦住。
# ② 新增 OAuth 发现与授权端点反代 → crm-mcp :3001。
#    必需性：下方 location / 反代的是 app:3000，而 OAuth 端点只在 mcp:3001 注册；
#    若不加，裸 IP 访问 /.well-known/* 会落到 app 得到 404，
#    客户端取不到 resource_metadata 就无法进入授权流程（卡在「授权中…」）。
#    必须透传 Host / X-Forwarded-Proto：issuer 与 resource 由请求头推导
#    （src/mcp/oauth.js deriveOrigin），缺失会令 metadata 指向 127.0.0.1 或协议不符。
server {
    listen 80 default_server;
    server_name _;

    # MCP 保持 http 直连：连接器配置为 http://<IP>/mcp。
    # 若整体跳 https，部分客户端不跟随 301 / 会丢弃 Authorization 头。
    location /mcp {
        proxy_pass http://127.0.0.1:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- MCP OAuth 发现与授权端点（RFC 9728 / 8414 / 7591）→ crm-mcp :3001 ----
    # 用 ^~ 前缀避免与下方 location / 的匹配产生歧义。
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /oauth/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ═══ crm_perf_20260916 ── 性能配置（本段由 scripts/tencent-lighthouse-deploy/nginx-perf-patch.py 幂等注入）
    # ⚠ 裸 IP 请求全走本 server 块（default_server）；deploy.sh 不管本文件，故改动跨 release 保留，
    #   但为可重复部署仍需保留此段。详细原理与实测数据见 docs/2026-09-16-prod-performance-diagnosis.md
    limit_req zone=crm_req burst=60 nodelay;
    limit_conn crm_conn 30;

    # SSE 事件流：必须关闭响应缓冲，否则事件被 nginx 攒批，前端收不到实时推进。
    location = /events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 业务 API：为 LLM / Agent 类长请求留足超时（location / 的默认 60s 会 504）。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态资源：替换 Express 的 `Cache-Control: public, max-age=0`（每次导航都回源校验）。
    location ~* \.(?:js|css|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|eot|map)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
