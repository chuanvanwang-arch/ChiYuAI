# Nginx 反代配置（放置于 /etc/nginx/sites-available/crm，软链到 sites-enabled）
# 先以 IP 提供 80 端口；有域名后改 server_name 并用 certbot 申请 HTTPS
# 入口策略（2026-09-05 拍板）：公网根路径 = 对外宣传页 landing.html；
#   AI 作战室（index.html）与登录面（home.html）改为显式路径访问，不再作为公网默认入口。
server {
    listen 80;
    server_name _;   # 有域名改成你的域名，如 crm.example.com

    # 公网默认入口 → 对外宣传页（注册自闭环；不登录即可访问）
    location = / {
        return 301 /landing.html;
    }
    # 注意：/index.html 是登录后的作战室入口（landing 页跳转目标），不可重定向，
    #   否则已登录用户会被弹回宣传页形成死循环。仅重定向裸根路径。

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP 对外分发层（StreamableHTTP）
    # 公网不暴露 3001 端口，统一走 http://<host>/mcp 反代到容器内的 3001。
    # 关键：MCP 使用 SSE 长连接 + 流式响应，必须关闭缓冲并提高读超时，
    #   否则响应被 Nginx 缓冲后客户端收不到（表现为连接挂起/超时）。
    #
    # 认证位置（2026-09-15 变更）：此前此处为 auth_basic（网关层 Basic Auth）。
    #   根因：连接器发 Authorization: Bearer，Nginx 要 Authorization: Basic，同一头互斥 →
    #   请求在网关层 401，永远到不了应用层（所有人连不上生产的真因）。
    #   现改为：认证收敛到应用层 Bearer 校验（src/mcp/httpAuth.js 的 HTTP 层 401 闸）。
    #   ⚠️ 若在此恢复 auth_basic，OAuth 也会一起被 401 拦住（OAuth 的 access_token 同样走 Bearer）。
    location /mcp {
        proxy_pass http://127.0.0.1:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;          # SSE 必需：禁用响应缓冲
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;     # 长会话（工具调用可能较久）
        proxy_send_timeout 3600s;
    }

    # ---- MCP OAuth 发现与授权端点（RFC 9728 / 8414 / 7591）→ crm-mcp :3001 ----
    # 必须透传 Host / X-Forwarded-Proto：issuer 与 resource 由请求头推导（src/mcp/oauth.js deriveOrigin），
    # 缺失会令 metadata 指向 http://127.0.0.1 或协议不符，客户端校验失败。
    # 用 ^~ 前缀避免与下方 location / 的正则产生歧义。
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /oauth/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# HTTPS 启用（certbot 会自动追加 443 server 块）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名
