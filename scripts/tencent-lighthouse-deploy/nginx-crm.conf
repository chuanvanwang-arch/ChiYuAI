# Nginx 反代配置（放置于 /etc/nginx/sites-available/crm，软链到 sites-enabled）
# 先以 IP 提供 80 端口；有域名后改 server_name 并用 certbot 申请 HTTPS
# 入口策略（2026-09-05 拍板）：公网根路径 = 对外宣传页 landing.html；
#   AI 作战室（index.html）与登录面（home.html）改为显式路径访问，不再作为公网默认入口。
server {
    # ⚠ 此处**刻意不写 `listen 80`**：certbot 已把 80 监听整体移交给文件末尾的
    #   「80→443 跳转块」。若此处补回 `listen 80`，两个 server 块会在 0.0.0.0:80 上
    #   server_name 冲突（nginx 报 conflicting server name 并忽略后者），
    #   导致明文 80 走本块代理到 3000 而非 `return 404` → HTTPS 强制跳转失效。
    #   需纯 IP/无域名部署时：在此恢复 `listen 80;`，并删除文件末尾 certbot 跳转块。
    # ⚠ 此值必须与线上一致：deploy.sh 每次 release 都会用本文件覆盖
    #   /etc/nginx/sites-available/crm，取值不一致会令 certbot 的 443 块域名不匹配。
    server_name www.chiyuai.com chiyuai.com;

    # 公网默认入口 → 对外宣传页（注册自闭环；不登录即可访问）
    location = / {
        return 301 /landing.html;
    }
    # 注意：/index.html 是登录后的作战室入口（landing 页跳转目标），不可重定向，
    #   否则已登录用户会被弹回宣传页形成死循环。仅重定向裸根路径。

    # ═══ crm_perf_20260916 ── 性能配置（本段由 scripts/tencent-lighthouse-deploy/nginx-perf-patch.py 幂等注入）
    # ⚠ 本文件由 deploy.sh 每次 release 重写 /etc/nginx/sites-available/crm，
    #   故此段必须保留在此模板内，否则下次 release 会抹掉线上性能配置（限流/缓存/SSE/API 超时）。
    # 详细原理与实测数据见 docs/2026-09-16-prod-performance-diagnosis.md
    limit_req zone=crm_req burst=60 nodelay;
    limit_conn crm_conn 30;

    # SSE 事件流：必须关闭响应缓冲，否则事件被 nginx 攒批，前端收不到实时推进。
    location = /events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 业务 API：为 LLM / Agent 类长请求留足超时（location / 的默认 60s 会 504）。
    #   ^~ 前缀同时保证 /api/**.js 之类的路径不会被下方静态正则误捡。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态资源：替换 Express 的 `Cache-Control: public, max-age=0`（每次导航都回源校验）。
    #   max-age=600 为保守值：资源未做哈希指纹，留 10 分钟陈旧窗口，发布后最迟 10 分钟收敛；
    #   ETag 保留，过期后仍可走 304 复用。
    location ~* \.(?:js|css|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|eot|map)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP 对外分发层（StreamableHTTP）
    # 公网不暴露 3001 端口，统一走 http://<host>/mcp 反代到容器内的 3001。
    # 关键：MCP 使用 SSE 长连接 + 流式响应，必须关闭缓冲并提高读超时，
    #   否则响应被 Nginx 缓冲后客户端收不到（表现为连接挂起/超时）。
    #
    # 认证位置（2026-09-15 变更）：此前此处为 auth_basic（网关层 Basic Auth）。
    #   根因：连接器发 Authorization: Bearer，Nginx 要 Authorization: Basic，同一头互斥 →
    #   请求在网关层 401，永远到不了应用层（所有人连不上生产的真因）。
    #   现改为：认证收敛到应用层 Bearer 校验（src/mcp/httpAuth.js 的 HTTP 层 401 闸）。
    #   ⚠️ 若在此恢复 auth_basic，OAuth 也会一起被 401 拦住（OAuth 的 access_token 同样走 Bearer）。
    location /mcp {
        proxy_pass http://127.0.0.1:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;          # SSE 必需：禁用响应缓冲
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;     # 长会话（工具调用可能较久）
        proxy_send_timeout 3600s;
    }

    # ---- MCP OAuth 发现与授权端点（RFC 9728 / 8414 / 7591）→ crm-mcp :3001 ----
    # 必须透传 Host / X-Forwarded-Proto：issuer 与 resource 由请求头推导（src/mcp/oauth.js deriveOrigin），
    # 缺失会令 metadata 指向 http://127.0.0.1 或协议不符，客户端校验失败。
    # 用 ^~ 前缀避免与下方 location / 的正则产生歧义。
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /oauth/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ═══ HTTPS 监听（与线上逐字一致；由 certbot 首次追加，现纳入模板防回退）═══
    # ⚠ 为什么必须写进模板：deploy.sh:192 无条件 cp 本文件覆盖线上配置。
    #   2026-09-16 排查发现线上含本节而仓库模板缺失 → 每次 release 都会抹掉 HTTPS，
    #   公网 443 直接掉线（certbot 证书本身不受影响，但无 server 块引用它）。
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.chiyuai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.chiyuai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTPS 启用（certbot 会自动追加 443 server 块）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名
#
# ⚠ 已于 2026-09-06 为 www.chiyuai.com 签发证书，下列 server 块由 certbot 追加，
#   同样已纳入本模板（缺失则 release 后 http 不再跳 https，明文入口被打开）。
server {
    if ($host = chiyuai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.chiyuai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.chiyuai.com chiyuai.com;
    return 404; # managed by Certbot
}
