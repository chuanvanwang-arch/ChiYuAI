<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="sans-serif" font-size="13" fill="#000">
  <rect x="0" y="0" width="680" height="470" fill="#fff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">图 2  九尺子混合裁决时序流程图</text>

  <!-- 参与者 -->
  <rect x="40" y="50" width="120" height="40" rx="4" fill="#fff" stroke="#000"/>
  <text x="100" y="75" text-anchor="middle">业务事件</text>
  <rect x="220" y="50" width="120" height="40" rx="4" fill="#fff" stroke="#000"/>
  <text x="280" y="75" text-anchor="middle">评分模块</text>
  <rect x="420" y="50" width="120" height="40" rx="4" fill="#fff" stroke="#000"/>
  <text x="480" y="75" text-anchor="middle">自治引擎</text>
  <rect x="560" y="50" width="110" height="40" rx="4" fill="#fff" stroke="#000"/>
  <text x="615" y="75" text-anchor="middle">配置中心</text>

  <!-- 生命周期竖线 -->
  <line x1="100" y1="90" x2="100" y2="430" stroke="#000"/>
  <line x1="280" y1="90" x2="280" y2="430" stroke="#000"/>
  <line x1="480" y1="90" x2="480" y2="430" stroke="#000"/>
  <line x1="615" y1="90" x2="615" y2="430" stroke="#000"/>

  <!-- 消息 -->
  <line x1="100" y1="110" x2="276" y2="110" stroke="#000"/>
  <polygon points="276,105 276,115 282,110" fill="#000"/>
  <text x="190" y="104" font-size="11">触发上下文 S1</text>

  <line x1="280" y1="140" x2="476" y2="140" stroke="#000"/>
  <polygon points="476,135 476,145 482,140" fill="#000"/>
  <text x="378" y="134" font-size="11">九项评分请求</text>

  <!-- 九尺子清单 -->
  <rect x="200" y="155" width="160" height="205" rx="4" fill="#fff" stroke="#000"/>
  <text x="280" y="173" text-anchor="middle" font-size="12" font-weight="bold">九尺子（RUBRICS）</text>
  <text x="212" y="195" font-size="11">① 清晰性 clarity（允许LLM精评）</text>
  <text x="212" y="215" font-size="11">② 准确性 accuracy *</text>
  <text x="212" y="235" font-size="11">③ 精确性 precision *</text>
  <text x="212" y="255" font-size="11">④ 相关性 relevance *</text>
  <text x="212" y="275" font-size="11">⑤ 深度 depth *</text>
  <text x="212" y="295" font-size="11">⑥ 广度 breadth *</text>
  <text x="212" y="315" font-size="11">⑦ 逻辑性 logic *</text>
  <text x="212" y="335" font-size="11">⑧ 重要性 importance *</text>
  <text x="212" y="355" font-size="11">⑨ 公平性 fairness *</text>
  <text x="212" y="378" font-size="10" fill="#444">* 八项为代码确定性判定</text>
  <text x="212" y="392" font-size="10" fill="#444">尺度 0–4；无证据记0不假填充</text>

  <line x1="280" y1="378" x2="476" y2="378" stroke="#000" stroke-dasharray="3 3"/>
  <polygon points="476,373 476,383 482,378" fill="#000"/>
  <text x="378" y="372" font-size="11">九项得分+依据</text>

  <!-- 证据双路合并 -->
  <line x1="480" y1="300" x2="611" y2="300" stroke="#000" stroke-dasharray="3 3"/>
  <polygon points="611,295 611,305 617,300" fill="#000"/>
  <text x="545" y="293" font-size="10">权重/阈值</text>
  <line x1="615" y1="320" x2="484" y2="320" stroke="#000" stroke-dasharray="3 3"/>
  <polygon points="484,315 484,325 478,320" fill="#000"/>
  <text x="545" y="338" font-size="10">外置权重回传</text>

  <!-- 加权聚合 -->
  <rect x="410" y="385" width="140" height="35" rx="4" fill="#fff" stroke="#000"/>
  <text x="480" y="407" text-anchor="middle">加权聚合→综合置信度 S3</text>

  <line x1="280" y1="395" x2="408" y2="402" stroke="#000"/>
  <polygon points="408,397 408,407 414,402" fill="#000"/>

  <text x="20" y="450" font-size="11" fill="#444">注：八项确定性评分每次重算结果一致；清晰性仅在模糊词命中且模型开启时调LLM，否则确定性代理+degraded留痕。</text>
</svg>
