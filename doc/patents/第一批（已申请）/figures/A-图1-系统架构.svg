<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="sans-serif" font-size="13" fill="#000">
  <rect x="0" y="0" width="680" height="460" fill="#fff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">图 1  决策处理系统模块架构图</text>

  <!-- 主链路 -->
  <rect x="30" y="70" width="120" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="90" y="92" text-anchor="middle">业务事件</text>
  <text x="90" y="108" text-anchor="middle">触发器</text>

  <rect x="180" y="70" width="130" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="245" y="88" text-anchor="middle">上下文装配模块</text>
  <text x="245" y="104" text-anchor="middle">(L1–L4 分层)</text>

  <rect x="340" y="70" width="120" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="400" y="88" text-anchor="middle">评分模块</text>
  <text x="400" y="104" text-anchor="middle">(rubricScorer)</text>

  <rect x="490" y="70" width="160" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="570" y="88" text-anchor="middle">自治引擎</text>
  <text x="570" y="104" text-anchor="middle">(autonomyEngine)</text>

  <!-- 箭头主链 -->
  <line x1="150" y1="93" x2="176" y2="93" stroke="#000"/>
  <polygon points="176,88 176,98 182,93" fill="#000"/>
  <line x1="310" y1="93" x2="336" y2="93" stroke="#000"/>
  <polygon points="336,88 336,98 342,93" fill="#000"/>
  <line x1="460" y1="93" x2="486" y2="93" stroke="#000"/>
  <polygon points="486,88 486,98 492,93" fill="#000"/>

  <!-- 红线校验 -->
  <rect x="490" y="150" width="160" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="570" y="168" text-anchor="middle">红线校验模块</text>
  <text x="570" y="184" text-anchor="middle">(adviceCard)</text>
  <line x1="570" y1="116" x2="570" y2="146" stroke="#000"/>
  <polygon points="565,146 575,146 570,152" fill="#000"/>

  <!-- 决策落库 -->
  <rect x="490" y="240" width="160" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="570" y="258" text-anchor="middle">决策落库模块</text>
  <text x="570" y="274" text-anchor="middle">(decisionRepo)</text>
  <line x1="570" y1="196" x2="570" y2="236" stroke="#000"/>
  <polygon points="565,236 575,236 570,242" fill="#000"/>

  <!-- 侧模块 -->
  <rect x="30" y="240" width="150" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="105" y="258" text-anchor="middle">置信度反算模块</text>
  <text x="105" y="274" text-anchor="middle">(confidence)</text>

  <rect x="30" y="330" width="150" height="46" rx="4" fill="#fff" stroke="#000"/>
  <text x="105" y="348" text-anchor="middle">配置中心</text>
  <text x="105" y="364" text-anchor="middle">(configStore)</text>

  <!-- 连线 -->
  <line x1="490" y1="263" x2="184" y2="263" stroke="#000" stroke-dasharray="4 3"/>
  <polygon points="184,258 184,268 178,263" fill="#000"/>
  <text x="300" y="256" text-anchor="middle" font-size="11">权重/阈值/政策版本</text>

  <line x1="105" y1="330" x2="105" y2="286" stroke="#000" stroke-dasharray="4 3"/>
  <polygon points="100,286 110,286 105,292" fill="#000"/>

  <line x1="400" y1="116" x2="400" y2="148" stroke="#000" stroke-dasharray="4 3"/>
  <text x="412" y="135" font-size="11">评分依据</text>

  <!-- 事件总线 -->
  <rect x="30" y="410" width="620" height="30" rx="4" fill="#fff" stroke="#000" stroke-dasharray="5 3"/>
  <text x="340" y="430" text-anchor="middle" font-size="12">事件总线（events/bus）—— 各模块经总线协同，所有业务写操作经决策第零闸校验</text>

  <!-- 参考标号 -->
  <text x="30" y="400" font-size="11" fill="#444">注：S2 评分→S3 置信度→S4 红线优先→S5 落库追溯，红线判定位于置信度判定之前。</text>
</svg>
