<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="sans-serif" font-size="13" fill="#000">
  <rect x="0" y="0" width="680" height="470" fill="#fff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">图 3  红线优先判定流程图（S4 核心安全特征）</text>

  <!-- 开始 -->
  <ellipse cx="120" cy="60" rx="60" ry="24" fill="#fff" stroke="#000"/>
  <text x="120" y="64" text-anchor="middle">决策裁决入口</text>

  <rect x="55" y="110" width="170" height="44" rx="4" fill="#fff" stroke="#000"/>
  <text x="140" y="128" text-anchor="middle" font-weight="bold">红线规则硬判定</text>
  <text x="140" y="145" text-anchor="middle">（先于置信度）</text>

  <line x1="120" y1="84" x2="120" y2="106" stroke="#000"/>
  <polygon points="115,106 125,106 120,112" fill="#000"/>

  <!-- 分支 -->
  <line x1="225" y1="132" x2="320" y2="132" stroke="#000"/>
  <polygon points="320,127 320,137 326,132" fill="#000"/>
  <text x="262" y="124" font-size="11">命中红线/EXCEPTION?</text>

  <rect x="330" y="110" width="200" height="44" rx="4" fill="#fff" stroke="#000"/>
  <text x="430" y="128" text-anchor="middle" font-weight="bold">强制人工在环审批</text>
  <text x="430" y="145" text-anchor="middle">屏蔽自主放行分支</text>

  <line x1="530" y1="132" x2="600" y2="132" stroke="#000"/>
  <polygon points="600,127 600,137 606,132" fill="#000"/>
  <text x="565" y="124" font-size="11">上级背书+审计高亮</text>

  <!-- 未命中走置信度 -->
  <line x1="140" y1="154" x2="140" y2="215" stroke="#000"/>
  <polygon points="135,215 145,215 140,221" fill="#000"/>
  <text x="150" y="190" font-size="11">未命中</text>

  <rect x="55" y="225" width="180" height="44" rx="4" fill="#fff" stroke="#000"/>
  <text x="145" y="243" text-anchor="middle" font-weight="bold">依据综合置信度判定</text>
  <text x="145" y="260" text-anchor="middle">（S3 阈值默认 0.7）</text>

  <line x1="235" y1="247" x2="320" y2="247" stroke="#000"/>
  <polygon points="320,242 320,252 326,247" fill="#000"/>
  <text x="277" y="239" font-size="11">≥ 阈值且有先例?</text>

  <rect x="330" y="225" width="150" height="44" rx="4" fill="#fff" stroke="#000"/>
  <text x="405" y="252" text-anchor="middle">自主放行(A档)</text>

  <rect x="500" y="225" width="150" height="44" rx="4" fill="#fff" stroke="#000"/>
  <text x="575" y="252" text-anchor="middle">升级人工(C档)</text>

  <!-- 收束到落库 -->
  <line x1="430" y1="154" x2="430" y2="320" stroke="#000" stroke-dasharray="4 3"/>
  <line x1="405" y1="269" x2="405" y2="320" stroke="#000"/>
  <line x1="575" y1="269" x2="575" y2="320" stroke="#000"/>
  <rect x="330" y="320" width="200" height="44" rx="4" fill="#fff" stroke="#000"/>
  <text x="430" y="338" text-anchor="middle" font-weight="bold">S5 决策落库+追溯</text>
  <text x="430" y="355" text-anchor="middle">decision_id / policy快照</text>

  <ellipse cx="430" cy="410" rx="60" ry="24" fill="#fff" stroke="#000"/>
  <text x="430" y="414" text-anchor="middle">结束</text>
  <line x1="430" y1="364" x2="430" y2="386" stroke="#000"/>
  <polygon points="425,386 435,386 430,392" fill="#000"/>

  <text x="20" y="450" font-size="11" fill="#444">关键：红线硬判定严格位于置信度判定之前（S4 先于 S3 判定分支），高置信度亦不覆盖红线。</text>
</svg>
