[project]
name = "chiyu-group"
version = "0.1.0"
description = "基于多维语义相似度的群体性诉求智能发现 DEMO"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
cuda = ["torch>=2.2", "transformers>=4.40"]
ascend = ["torch>=2.1", "torch_npu>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
