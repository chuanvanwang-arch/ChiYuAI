<h2>裁决可解释（审计明细）</h2>
<div id="view">
  <p>8 项确定性评分 + RRF 融合 + 红线优先，每条裁决留审计痕迹（可回溯）。</p>
  <table id="grid"><thead><tr><th>工单ID</th><th>动作</th><th>簇ID</th><th>融合分</th><th>置信度</th><th>红线</th></tr></thead><tbody></tbody></table>
</div>
<script>
async function loadAudit(){
  // P5 挂载点：接入审计接口后替换为真实数据（当前展示结构示例）
  const s = await (await fetch('/api/state')).json();
  const sample = [{
    order_id:"T1", action:"join", cluster_id:"C1", fused:0.95, confidence:0.83, redline:""
  }];
  const rows = sample.map(r => `<tr><td>${r.order_id}</td><td>${r.action}</td><td>${r.cluster_id}</td><td>${r.fused}</td><td>${r.confidence}</td><td>${r.redline||'无'}</td></tr>`).join('');
  document.querySelector('#grid tbody').innerHTML = rows;
}
loadAudit();
</script>
