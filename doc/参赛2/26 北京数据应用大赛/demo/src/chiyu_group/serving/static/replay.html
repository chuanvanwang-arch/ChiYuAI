<h2>流式回放</h2>
<div id="view">
  <button onclick="runReplay()">回放样例数据(50条)</button>
  <pre id="result" style="background:#fff;padding:12px;border-radius:8px"></pre>
</div>
<script>
async function runReplay(){
  const r = await (await fetch('/api/replay', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({dataset:'sample'})})).json();
  document.getElementById('result').textContent = JSON.stringify(r, null, 2);
}
</script>
